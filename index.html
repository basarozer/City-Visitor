<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Türkiye Gezi Haritam</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h1 {
    text-align: center;
    margin: 16px 0 5px;
}

#aciklama {
    text-align: center;
    margin-bottom: 12px;
    color: #555;
}

#map {
    width: 96%;
    height: 76vh;
    margin: auto;
    background: #dceef7;
    border: 1px solid #aaa;
    border-radius: 10px;
}

.legend {
    text-align: center;
    margin: 14px;
}

.box {
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-left: 18px;
    margin-right: 5px;
    border: 1px solid #777;
    vertical-align: middle;
}

.province-label {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-size: 10px;
    font-weight: bold;
    color: #222;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
}
</style>
</head>

<body>

<h1>🇹🇷 Türkiye Gezi Haritam</h1>

<div id="aciklama">
Tıkla: Gezdim → Yakında → Uzun Vadede &nbsp; | &nbsp; Sağ tık: Sıfırla
</div>

<div id="map"></div>

<div class="legend">

<span class="box" style="background:#55b86a"></span>
Gezdim

<span class="box" style="background:#f0a33b"></span>
Yakında Gideceğim

<span class="box" style="background:#5793d1"></span>
Uzun Vadede

<span class="box" style="background:#eeeeee"></span>
Seçilmedi

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map", {
    attributionControl: false
});

const colors = [
    "#eeeeee",
    "#55b86a",
    "#f0a33b",
    "#5793d1"
];

let saved =
JSON.parse(localStorage.getItem("turkiyeGeziHaritasi") || "{}");


const geojsonURL =
"https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/provinces.geojson";


fetch(geojsonURL)

.then(response => {

    if (!response.ok) {
        throw new Error("Harita dosyası yüklenemedi");
    }

    return response.json();

})

.then(data => {


    console.log("GeoJSON yüklendi:", data);


    const turkeyLayer = L.geoJSON(data, {


        style: function(feature) {

            const name = getProvinceName(feature);

            const state = saved[name] || 0;

            return {
                color: "#ffffff",
                weight: 1.2,
                fillColor: colors[state],
                fillOpacity: 1
            };

        },


        onEachFeature: function(feature, layer) {


            const name = getProvinceName(feature);


            /* NORMAL TIK */

            layer.on("click", function() {

                let state = saved[name] || 0;

                state++;

                if (state > 3) {
                    state = 1;
                }

                saved[name] = state;

                save();

                layer.setStyle({
                    fillColor: colors[state]
                });

            });



            /* SAĞ TIK */

            layer.on("contextmenu", function(e) {

                L.DomEvent.preventDefault(e);

                delete saved[name];

                save();

                layer.setStyle({
                    fillColor: colors[0]
                });

            });



            /* İL İSMİ */

            const center = layer.getBounds().getCenter();

            L.marker(center, {

                interactive: false,

                icon: L.divIcon({

                    className: "province-label",

                    html: name,

                    iconSize: [100, 20],

                    iconAnchor: [50, 10]

                })

            }).addTo(map);

        }

    }).addTo(map);


    map.fitBounds(
        turkeyLayer.getBounds(),
        { padding: [10,10] }
    );


})


.catch(error => {

    console.error(error);

    alert(
        "Harita yüklenemedi. Sayfayı yenileyin."
    );

});



/* ------------------------------------
   İL ADINI BUL
------------------------------------ */

function getProvinceName(feature) {

    const p = feature.properties || {};


    /*
    Bu fonksiyon farklı GeoJSON isimlendirmelerini
    otomatik olarak kontrol eder.
    */

    const possibleNames = [

        p.name,
        p.NAME,
        p.NAME_1,
        p.Name,
        p.ad,
        p.AD,
        p.il,
        p.IL,
        p.il_adi,
        p.IL_ADI,
        p.province,
        p.PROVINCE,
        p.city,
        p.CITY_NAME,
        p.sehir,
        p["Şehir_Ad"]

    ];


    for (const value of possibleNames) {

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {

            return String(value);

        }

    }


    /*
    Yukarıdaki isimlerden hiçbiri yoksa,
    properties içindeki değerleri kontrol et.
    "İl" gibi tip bilgisini isim olarak kullanma.
    */

    for (const key in p) {

        const value = p[key];

        if (
            typeof value === "string" &&
            value.length >= 3 &&
            value.length <= 25 &&
            value.toLowerCase() !== "il" &&
            value.toLowerCase() !== "province" &&
            !value.startsWith("TR-")
        ) {

            return value;

        }

    }


    return "?";
}



/* ------------------------------------
   KAYDET
------------------------------------ */

function save() {

    localStorage.setItem(
        "turkiyeGeziHaritasi",
        JSON.stringify(saved)
    );

}

</script>

</body>
</html>
