<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Türkiye Gezi Haritam</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
  }

  h1 {
    text-align: center;
    margin-bottom: 5px;
  }

  .aciklama {
    text-align: center;
    margin-bottom: 15px;
  }

  #map {
    width: 95%;
    height: 75vh;
    margin: auto;
    border: 1px solid #aaa;
    border-radius: 10px;
  }

  .legend {
    text-align: center;
    margin: 15px;
    font-size: 16px;
  }

  .box {
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-left: 15px;
    margin-right: 5px;
    vertical-align: middle;
  }

  .province-label {
    background: transparent;
    border: none;
    box-shadow: none;
    font-weight: bold;
    font-size: 10px;
    color: #222;
    text-align: center;
  }
</style>
</head>

<body>

<h1>🇹🇷 Türkiye Gezi Haritam</h1>

<div class="aciklama">
İle tıklayarak durumunu değiştir • Sağ tık ile temizle
</div>

<div id="map"></div>

<div class="legend">
  <span class="box" style="background:#55b86a"></span> Gezdim
  <span class="box" style="background:#f0a33b"></span> Yakında Gideceğim
  <span class="box" style="background:#5793d1"></span> Uzun Vadede
  <span class="box" style="background:#dddddd"></span> Seçilmedi
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map', {
  zoomControl: true
}).setView([39, 35], 6);

const colors = [
  "#dddddd",
  "#55b86a",
  "#f0a33b",
  "#5793d1"
];

let saved = JSON.parse(localStorage.getItem("turkiyeGeziHaritasi") || "{}");

const geojsonURL =
"https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/provinces.geojson";

fetch(geojsonURL)
.then(response => response.json())
.then(data => {

  const layer = L.geoJSON(data, {

    style: function(feature) {

      const name =
        feature.properties.name ||
        feature.properties.NAME_1 ||
        feature.properties.NAME ||
        feature.properties.il_adi ||
        feature.properties.ad ||
        "İl";

      const state = saved[name] || 0;

      return {
        color: "#ffffff",
        weight: 1,
        fillColor: colors[state],
        fillOpacity: 1
      };
    },

    onEachFeature: function(feature, provinceLayer) {

      const name =
        feature.properties.name ||
        feature.properties.NAME_1 ||
        feature.properties.NAME ||
        feature.properties.il_adi ||
        feature.properties.ad ||
        "İl";

      provinceLayer.on("click", function() {

        let state = saved[name] || 0;

        state++;

        if (state > 3) {
          state = 1;
        }

        saved[name] = state;

        localStorage.setItem(
          "turkiyeGeziHaritasi",
          JSON.stringify(saved)
        );

        provinceLayer.setStyle({
          fillColor: colors[state]
        });

      });

      provinceLayer.on("contextmenu", function(e) {

        L.DomEvent.preventDefault(e);

        delete saved[name];

        localStorage.setItem(
          "turkiyeGeziHaritasi",
          JSON.stringify(saved)
        );

        provinceLayer.setStyle({
          fillColor: colors[0]
        });

      });

      const center = provinceLayer.getBounds().getCenter();

      L.marker(center, {
        interactive: false,
        icon: L.divIcon({
          className: "province-label",
          html: name,
          iconSize: [80,20]
        })
      }).addTo(map);

    }

  }).addTo(map);

  map.fitBounds(layer.getBounds());

})
.catch(error => {
  console.error(error);
  alert("Harita verisi yüklenemedi.");
});

</script>

</body>
</html>
